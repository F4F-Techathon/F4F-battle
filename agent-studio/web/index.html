<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今晚吃啥</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.3' cy='.25' r='.9'%3E%3Cstop offset='0' stop-color='%23fff6e2'/%3E%3Cstop offset='.45' stop-color='%23d9b77f'/%3E%3Cstop offset='1' stop-color='%238a6a3a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E" />
    <!-- the film's character rig and baked lip-sync, served read-only from the video project -->
    <script src="/film/assets/js/rig.js"></script>
    <script src="/film/assets/js/lipsync.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  </head>
  <body>
    <header class="appbar">
      <div class="brand"><span class="mark"></span><b>今晚吃啥</b></div>
      <nav class="tabs">
        <button data-tab="live" class="on">演播</button>
        <button data-tab="library">资产</button>
        <button data-tab="system">系统</button>
      </nav>
      <div class="bar-right">
        <span class="pill btn" id="pill-jev" title="设置 Jev"><i></i>Jev</span>
        <span class="pill btn" id="pill-llm" title="方言改写模型"><i></i>改写</span>
        <span class="pill btn" id="pill-tts" title="配音状态"><i></i>配音</span>
        <button class="iconbtn" id="btn-settings" title="设置"></button>
      </div>
    </header>
    <div id="view-live" class="view live"></div>
    <div id="view-library" class="view library hidden"></div>
    <div id="view-system" class="view system hidden"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
